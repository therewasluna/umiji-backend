# Umiji panel, with Postgres, Valkey and Caddy for HTTPS. The sub page and the nodes have their own
# installs. Settings are in .env; the secrets are made on the first start, in ./secrets. See DEPLOY.md.
name: umiji

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - umiji-network
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

services:
  # Makes the missing secrets in ./secrets (APP_SECRET, the database password, ...), then exits.
  umiji-secrets:
    image: ghcr.io/therewasluna/umiji-panel:latest
    container_name: umiji-secrets
    entrypoint: ['/bin/sh', '-c', '. /opt/app/docker-secrets.sh && make_secrets']
    network_mode: none
    volumes:
      - ./secrets:/var/lib/umiji/secrets

  umiji:
    image: ghcr.io/therewasluna/umiji-panel:latest
    container_name: umiji
    hostname: umiji
    <<: *common
    env_file: .env
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Put your panel domain in PANEL_DOMAIN in .env}
      SUB_PUBLIC_DOMAIN: ${SUB_PUBLIC_DOMAIN:-${SUB_DOMAIN:?Put your sub page domain in SUB_DOMAIN in .env}}
      FRONT_END_DOMAIN: ${FRONT_END_DOMAIN:-*}
      METRICS_USER: ${METRICS_USER:-admin}
      REDIS_SOCKET: /var/run/valkey/valkey.sock
    # Lets a node proxy on this server be set as 127.0.0.1 (the panel maps it to host.docker.internal).
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./secrets:/var/lib/umiji/secrets:ro
      - valkey-socket:/var/run/valkey
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:3001:3001
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:$${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      umiji-secrets:
        condition: service_completed_successfully
      umiji-db:
        condition: service_healthy
      umiji-redis:
        condition: service_healthy

  umiji-db:
    image: postgres:18.4
    container_name: umiji-db
    hostname: umiji-db
    shm_size: 512mb
    <<: *common
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/umiji-secrets/db_password
      TZ: UTC # DO NOT CHANGE DATABASE TIMEZONE. IT MUST BE UTC.
    ports:
      - 127.0.0.1:6767:5432
    volumes:
      - umiji-db-data:/var/lib/postgresql
      - ./secrets:/run/umiji-secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3
    depends_on:
      umiji-secrets:
        condition: service_completed_successfully

  umiji-redis:
    image: valkey/valkey:9-alpine
    container_name: umiji-redis
    hostname: umiji-redis
    <<: *common
    volumes:
      - valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ['CMD', 'valkey-cli', '-s', '/var/run/valkey/valkey.sock', 'ping']
      interval: 3s
      timeout: 3s
      retries: 3

  # Built-in HTTPS (the caddy profile, on by default in .env): gets and renews the certificates itself.
  # It reads the domains from .env. After editing caddy/Caddyfile: docker compose restart umiji-caddy
  umiji-caddy:
    image: caddy:2.10.2
    profiles: [caddy]
    container_name: umiji-caddy
    hostname: umiji-caddy
    <<: *common
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      SUB_DOMAIN: ${SUB_DOMAIN}
      SUB_PAGE_HERE: ${SUB_PAGE_HERE:-yes}
      SUB_PAGE_IP: ${SUB_PAGE_IP:-}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./caddy:/etc/caddy:ro
      - umiji-caddy-data:/data
      - umiji-caddy-config:/config

networks:
  # The sub page's install joins this network when it runs on the same server.
  umiji-network:
    name: umiji-network
    driver: bridge

volumes:
  umiji-db-data:
    name: umiji-db-data
  valkey-socket:
    name: valkey-socket
  # Caddy's certificates and keys. Keep it: Let's Encrypt limits how often a domain can get a new one.
  umiji-caddy-data:
    name: umiji-caddy-data
  umiji-caddy-config:
    name: umiji-caddy-config
