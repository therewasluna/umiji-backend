# Local dev databases for the backend (Postgres on :6767, Valkey on :6380).
name: umiji-dev
services:
  db:
    image: postgres:18.4
    environment: [POSTGRES_USER=postgres, POSTGRES_PASSWORD=postgres, POSTGRES_DB=postgres, TZ=UTC]
    ports: ['127.0.0.1:6767:5432']
    volumes: [db:/var/lib/postgresql]
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 3s, retries: 10}
  redis:
    image: valkey/valkey:9-alpine
    command: valkey-server --save "" --appendonly no --maxmemory-policy noeviction --port 6379
    ports: ['127.0.0.1:6380:6379']
volumes: {db: {}}
