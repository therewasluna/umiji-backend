x-base: &base
  image: ghcr.io/therewasluna/umiji-backend:3

x-common: &common
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: always
  networks:
    - umiji-network

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: 5

x-env: &env
  env_file: .env

services:
  umiji-rest-api: # Scaling is OK
    <<: [*base, *common, *logging, *env]
    container_name: 'umiji-rest-api'
    hostname: umiji-rest-api
    entrypoint: []
    command: 'pm2-runtime start ecosystem.config.js --env production --only umiji-api' # Overrides CMD from Dockerfile
    depends_on:
      umiji-db:
        condition: service_healthy
      umiji-redis:
        condition: service_healthy
      umiji-scheduler:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000' # Expose Rest API port

  umiji-scheduler: # Do not scale this service!
    <<: [*base, *common, *logging, *env]
    container_name: 'umiji-scheduler'
    hostname: umiji-scheduler
    entrypoint: ['/bin/sh', 'docker-entrypoint.sh'] # Migrations, seeding, etc. IMPORTANT: Entrypoint needs to be in one of services. Its applies migrations and seeding database!
    command: 'pm2-runtime start ecosystem.config.js --env production --only umiji-scheduler' # Overrides CMD from Dockerfile
    depends_on:
      umiji-db:
        condition: service_healthy
      umiji-redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001' # Expose metrics port
    healthcheck: # Only scheduler service has metrics port
      test: ['CMD-SHELL', 'curl -f http://localhost:${METRICS_PORT:-3001}/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  umiji-processor: # Scaling is OK
    <<: [*base, *common, *logging, *env]
    container_name: 'umiji-processor'
    hostname: umiji-processor
    entrypoint: []
    command: 'pm2-runtime start ecosystem.config.js --env production --only umiji-jobs' # Overrides CMD from Dockerfile
    depends_on:
      umiji-db:
        condition: service_healthy
      umiji-redis:
        condition: service_healthy
      umiji-scheduler:
        condition: service_healthy

  umiji-db:
    image: postgres:18.4
    container_name: 'umiji-db'
    hostname: umiji-db
    shm_size: 512mb
    <<: [*common, *logging, *env]

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TZ=UTC
    ports:
      - '127.0.0.1:6767:5432'
    volumes:
      - umiji-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 10s
      retries: 3

  umiji-redis:
    image: valkey/valkey:9-alpine
    container_name: umiji-redis
    hostname: umiji-redis
    <<: [*common, *logging]
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 10s
      retries: 3

networks:
  umiji-network:
    name: umiji-network
    driver: bridge
    external: false

volumes:
  umiji-db-data:
    name: umiji-db-data
    driver: local
    external: false
