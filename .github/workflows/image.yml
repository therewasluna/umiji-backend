# Builds the panel image (this backend + the umiji-frontend main branch) for amd64 and arm64 and
# pushes it to ghcr.io/therewasluna/umiji-panel. A frontend-only change needs a manual run
# (Actions → Panel image → Run workflow).
name: Panel image

on:
    push:
        branches: [main, 'ci/**']
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: panel-image-${{ github.ref }}
    cancel-in-progress: true

jobs:
    image:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/checkout@v4
              with:
                  repository: therewasluna/umiji-frontend
                  path: umiji-frontend

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Build the frontend
              id: frontend
              working-directory: umiji-frontend
              run: |
                  npm ci --no-audit --no-fund
                  DOMAIN_OVERRIDE=0 DOMAIN_BACKEND= npm run start:build
                  mkdir -p ../frontend-zip
                  zip -qr ../frontend-zip/umiji-frontend.zip ./dist
                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/therewasluna/umiji-panel
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=branch
                      type=ref,event=tag
                      type=sha

            - name: Build time
              id: time
              run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  build-contexts: frontend-zip=frontend-zip
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      __UMIJI_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
                      __UMIJI_METADATA_GIT_FRONTEND_COMMIT=${{ steps.frontend.outputs.commit }}
                      __UMIJI_METADATA_GIT_BRANCH=${{ github.ref_name }}
                      __UMIJI_METADATA_BUILD_TIME=${{ steps.time.outputs.now }}
                      __UMIJI_METADATA_BUILD_NUMBER=${{ github.run_number }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
